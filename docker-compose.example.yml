# JobMatch AI — Docker Compose template.
#
# Copy this file to docker-compose.yml and fill in your real API keys:
#     cp docker-compose.example.yml docker-compose.yml
# docker-compose.yml is git-ignored (it holds your secrets); this example is
# the versioned template.
#
# Single service: the `web` dashboard owns everything — serves the UI, runs the
# pipeline (on the "Rodar agora" button AND on its recurring schedule) and shows
# a countdown to the next automatic run. One process = one place a run can start,
# so runs never overlap (the in-app guard rejects a trigger while busy).
#     docker compose build
#     docker compose up -d
#     open http://localhost:8000
#
# The environment: block lists EVERY variable the code reads, with its default,
# as a reference of what can be tuned. Uncommented = active; commented = using
# the code default (uncomment to override). See also .env.example.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: jobmatch-ai:latest
    container_name: jobmatch-web
    entrypoint: ["python", "webapp.py"]
    restart: unless-stopped

    # --- Security hardening ---
    read_only: true                  # immutable root filesystem
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:                           # writable scratch (root fs is read-only)
      - /tmp
      - /home/appuser

    environment:
      # ---- Providers ----
      # PROVIDER_ORDER is currently Gemini-only (src/matcher.py), so GEMINI_API_KEY
      # is the one that matters; OpenRouter is disabled (its scores were unreliable).
      GEMINI_API_KEY: "your_gemini_key_here"           # active LLM provider
      # OPENROUTER_API_KEY: "your_openrouter_key_here" # unused until re-enabled in PROVIDER_ORDER

      # ---- Run control / scheduler (webapp.py + src/run_controller.py) ----
      SCHEDULER_ENABLED: "true"       # default true — automatic recurring runs
      RUN_INTERVAL_SECONDS: "21600"   # default 21600 (6h); "0" = manual only (button)
      RUN_ON_START: "true"            # code default false; first run on start vs after one interval
      RUN_STATE_PATH: "data/run_state.json"  # default run_state.json (→ ./data; root fs is read-only)

      # ---- File paths ----
      KEYWORDS_CONFIG_PATH: "config/keywords.yaml"   # default config/keywords.yaml
      HISTORY_PATH: "data/vagas_historico.json"      # default vagas_historico.json

      # ---- Web UI ----
      WEB_HOST: "0.0.0.0"             # default 0.0.0.0
      WEB_PORT: "8000"                # default 8000

      # ---- Local vector scoring (ALWAYS on: score_vetor_desc, score_title, the
      #      scope gate; also the LLM-failure fallback). Model downloads on the
      #      first run into HF_HOME on the ./data volume — needs network once. ----
      HF_HOME: "/app/data/hf-cache"   # model cache; persist in ./data (root fs read-only, $HOME tmpfs)
      # LOCAL_MATCH_MODEL: "minishlab/potion-multilingual-128M"  # MUST be multilingual (profile PT, jobs PT+EN)
      # LOCAL_MATCH_SIM_FLOOR: "0.30"     # cosine floor mapped to fallback score 0
      # LOCAL_MATCH_SIM_CEIL: "0.70"      # cosine ceil mapped to fallback score 100

      # ---- Embedding scope gate (drop only when BOTH title & desc are far off) ----
      # SCOPE_TITLE_MIN: "0.40"           # title vs termos_busca (raw cosine)
      # SCOPE_DESC_MIN: "0.40"            # description vs CV (raw cosine)

      # ---- LLM tuning (optional; defaults shown) ----
      # OPENROUTER_MODEL: ""                # pin ONE model (overrides the list below)
      # OPENROUTER_MODELS: "openai/gpt-oss-120b:free,deepseek/deepseek-chat-v3-0324:free,meta-llama/llama-3.3-70b-instruct:free,qwen/qwen3-next-80b-a3b-instruct:free,nvidia/nemotron-3-super-120b-a12b:free,google/gemini-2.0-flash-exp:free"
      # OPENROUTER_AUTO_FREE_MODELS: "true" # auto-append discovered :free models
      # GEMINI_MODEL: "gemini-2.5-flash"
      # LLM_TEMPERATURE: "0.1"
      # OPENROUTER_MAX_TOKENS: "2000"
      # LLM_REQUEST_TIMEOUT: "60"           # seconds
      # LLM_MAX_PROVIDER_CYCLES: "2"        # provider-chain retry cycles on quota/429
      # LLM_QUOTA_RETRY_WAIT: "5"           # seconds between cycles

      # ---- Relevance flag thresholds (the "só relevantes" filter in the web UI) ----
      # REPORT_MIN_CLT_SCORE: "0.7"         # min CLT confidence 0–1
      # REPORT_MIN_MATCH_SCORE: "70"        # min profile match 0–100

      # ---- Scraper (LinkedIn Guest API politeness/limits) ----
      # SCRAPER_MAX_RETRIES: "5"
      # SCRAPER_RETRY_WAIT: "5"             # seconds
      # SCRAPER_REQUEST_TIMEOUT: "15"       # seconds
      # SCRAPER_MAX_PAGES: "10"             # result pages per (term × filter)
      # SCRAPER_MIN_REQUEST_DELAY: "1.0"    # random pause floor (s)
      # SCRAPER_MAX_REQUEST_DELAY: "3.0"    # random pause ceil (s)

    ports:
      - "8000:8000"                  # browse at http://localhost:8000

    volumes:
      - ./config:/app/config:ro      # your keywords.yaml (read-only)
      - ./data:/app/data             # history + hf-cache (model) + run state (writable)
