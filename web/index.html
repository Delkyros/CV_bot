<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JobMatch — minhas vagas</title>
  <style>
    :root {
      --bg: #0f1419; --panel: #1a212b; --panel-2: #222b38; --line: #2c3743;
      --txt: #e6edf3; --muted: #9aa7b4; --accent: #4f9cf9;
      --new: #6b7785; --viewed: #d6a23a; --applied: #3fb950; --error: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--txt);
      font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    header {
      position: sticky; top: 0; z-index: 5; background: var(--panel);
      border-bottom: 1px solid var(--line); padding: 14px 20px;
    }
    h1 { margin: 0 0 10px; font-size: 18px; }
    h1 small { color: var(--muted); font-weight: 400; font-size: 13px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
    .tab {
      background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
      padding: 6px 14px; border-radius: 7px; cursor: pointer; font: inherit;
    }
    .tab:hover { color: var(--txt); }
    .tab.on { background: var(--accent); color: #042; border-color: var(--accent); }
    .tab.on#tabApplied { background: var(--applied); color: #04210d; border-color: var(--applied); }
    .tab.on#tabErrors { background: var(--error); color: #fff; border-color: var(--error); }
    .tab-count {
      display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px;
      border-radius: 99px; background: rgba(0,0,0,.25); font-size: 11px; text-align: center;
    }
    /* The classification column only matters on the Erros tab. */
    .col-class { display: none; }
    table.tab-errors .col-class { display: table-cell; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; }
    .controls label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }
    .controls input[type=search] {
      background: var(--panel-2); border: 1px solid var(--line); color: var(--txt);
      border-radius: 6px; padding: 6px 10px; min-width: 220px;
    }
    .stats { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
    .stats b { color: var(--txt); }
    .wrap { padding: 16px 20px 60px; overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; min-width: 920px; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; position: sticky; top: 0; background: var(--panel); }
    th[data-sort] { cursor: pointer; user-select: none; white-space: nowrap; }
    th[data-sort]:hover { color: var(--txt); }
    th.sorted { color: var(--accent); }
    tbody tr:hover { background: #1c2530; }
    tr.applied { opacity: .62; }
    td.score { font-variant-numeric: tabular-nums; font-weight: 700; }
    td.num { font-variant-numeric: tabular-nums; color: var(--muted); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .company { color: var(--muted); font-size: 13px; }
    .badge { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 11px; border: 1px solid var(--line); color: var(--muted); }
    .status-btns { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
    .status-btns button {
      background: var(--panel-2); color: var(--muted); border: 0; padding: 5px 9px;
      cursor: pointer; font-size: 12px; border-left: 1px solid var(--line);
    }
    .status-btns button:first-child { border-left: 0; }
    .status-btns button.on[data-s=new] { background: var(--new); color: #fff; }
    .status-btns button.on[data-s=viewed] { background: var(--viewed); color: #1a1205; }
    .status-btns button.on[data-s=applied] { background: var(--applied); color: #04210d; }
    .status-btns button.on[data-s=error] { background: var(--error); color: #fff; }
    .status-btns button[data-ec] { color: #c98a8d; }
    .status-btns button.on[data-ec] { color: #fff; }
    textarea.notes {
      width: 200px; max-width: 100%; min-height: 30px; resize: vertical;
      background: var(--panel-2); border: 1px solid var(--line); color: var(--txt);
      border-radius: 6px; padding: 5px 7px; font: inherit;
    }
    textarea.notes.saved { border-color: var(--applied); }
    .empty { color: var(--muted); padding: 40px; text-align: center; }
    #granBtns button.on { background: var(--accent); color: #042; }
    .legend { display: flex; gap: 18px; margin-bottom: 14px; color: var(--muted); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
    #chart { width: 100%; min-width: 640px; height: 340px; font-variant-numeric: tabular-nums; }
    #chart .bar:hover { opacity: .8; }
    #chart text { fill: var(--muted); font-size: 11px; }
    #chart .val { fill: var(--txt); font-size: 10px; }
    .toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: var(--applied); color: #04210d; padding: 8px 16px; border-radius: 8px;
      font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast.err { background: #f85149; color: #fff; }
    .run-ctl { display: inline-flex; align-items: center; gap: 10px; margin-left: auto; }
    .run-btn {
      background: var(--accent); color: #042; border: 0; border-radius: 7px;
      padding: 6px 14px; cursor: pointer; font: inherit; font-weight: 600;
    }
    .run-btn:disabled { background: var(--panel-2); color: var(--muted); cursor: default; }
    .run-status { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .run-progress { display: inline-flex; align-items: center; gap: 8px; }
    .run-bar { width: 140px; height: 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
    .run-bar-fill { display: block; height: 100%; width: 0%; background: var(--accent); transition: width .3s; }
    .run-pct { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    /* Relatório tab: 3-scorer comparison + expandable analysis. */
    th[data-rsort] { cursor: pointer; user-select: none; white-space: nowrap; }
    th[data-rsort]:hover { color: var(--txt); }
    #repTbl { min-width: 720px; }
    tr.rep-row { cursor: pointer; }
    tr.rep-row:hover { background: #1c2530; }
    tr.rep-detail > td { background: var(--panel-2); }
    .rep-detail h4 { margin: 8px 0 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .rep-detail ul { margin: 0 0 8px; padding-left: 18px; }
    .score-cell { font-variant-numeric: tabular-nums; font-weight: 700; }
    .score-na { color: var(--muted); font-weight: 400; }
  </style>
</head>
<body>
  <header>
    <h1>JobMatch — minhas vagas <small id="sub"></small></h1>
    <div class="tabs">
      <button class="tab on" id="tabJobs" data-tab="jobs">Vagas <span class="tab-count" id="cJobs">0</span></button>
      <button class="tab" id="tabApplied" data-tab="applied">Inscritas <span class="tab-count" id="cApplied">0</span></button>
      <button class="tab" id="tabErrors" data-tab="errors">Erros <span class="tab-count" id="cErrors">0</span></button>
      <button class="tab" id="tabReport" data-tab="report">Relatório</button>
      <button class="tab" id="tabMetrics" data-tab="metrics">Métricas</button>
      <span class="run-ctl">
        <button id="runBtn" class="run-btn">▶ Rodar agora</button>
        <span class="run-progress" id="runProgress" hidden>
          <span class="run-bar"><span class="run-bar-fill" id="runBarFill"></span></span>
          <span class="run-pct" id="runPct"></span>
        </span>
        <span class="run-status" id="runStatus"></span>
      </span>
    </div>
    <div class="controls">
      <input type="search" id="q" placeholder="Buscar por título, empresa, local…" />
      <label><input type="checkbox" id="onlyRelevant" checked /> Só relevantes</label>
      <label><input type="checkbox" id="onlyNew" checked /> Só novas</label>
      <label><input type="checkbox" id="hideApplied" /> Ocultar inscritas</label>
      <label><input type="checkbox" id="showIrrelevant" /> Mostrar irrelevantes</label>
      <span class="stats" id="stats"></span>
    </div>
    <div class="controls" id="metricsCtl" hidden>
      <label>Agrupar por</label>
      <div class="status-btns" id="granBtns">
        <button data-g="day">Dia</button>
        <button data-g="week" class="on">Semana</button>
        <button data-g="month">Mês</button>
      </div>
      <span class="stats" id="metricsStats"></span>
    </div>
  </header>

  <div class="wrap" id="tableWrap">
    <table id="tbl">
      <thead>
        <tr>
          <th data-sort="status">Status</th><th data-sort="match_score">Score</th>
          <th data-sort="score_clt">CLT</th><th data-sort="job_title">Vaga</th>
          <th data-sort="inferred_contract_type">Contrato</th><th data-sort="workplace_type">Modelo</th>
          <th data-sort="location">Local</th>
          <th data-sort="error_class" class="col-class">Classificação</th>
          <th data-sort="first_seen_at">Visto em</th>
          <th data-sort="notes">Notas</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>Nenhuma vaga encontrada.</div>
  </div>

  <div class="wrap" id="metricsWrap" hidden>
    <div class="legend" id="legend"></div>
    <svg id="chart" role="img" aria-label="Gráfico de vagas por período"></svg>
    <div class="empty" id="metricsEmpty" hidden>Sem dados com data no período.</div>
  </div>

  <div class="wrap" id="reportWrap" hidden>
    <table id="repTbl">
      <thead>
        <tr>
          <th data-rsort="job_title">Vaga</th>
          <th data-rsort="score_gemini">Gemini</th>
          <th data-rsort="score_vetor_desc">Vetor·descrição</th>
          <th data-rsort="score_title">Título</th>
        </tr>
      </thead>
      <tbody id="repRows"></tbody>
    </table>
    <div class="empty" id="reportEmpty" hidden>Nenhuma vaga com score ainda — rode o pipeline.</div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STATUSES = [["new", "Novo"], ["viewed", "Visto"], ["applied", "Inscrito"]];
    // One button per error class (single click marks + classifies). Short
    // labels keep the row compact; the full class lives in the tooltip.
    const ERROR_CLASS_SHORT = { "Localidade/Modelo incorreto": "Local", "Não é CLT": "Não CLT", "Escopo incorreto": "Escopo" };
    let JOBS = [];
    let ERROR_CLASSES = [];
    let LAST_RUN = null;

    // Column sort. Numeric/date columns default to descending (highest/newest
    // first); text columns to ascending (A–Z). Default view: newest first.
    const SORT_TYPES = {
      status: "status", match_score: "num", score_clt: "num",
      job_title: "str", inferred_contract_type: "str", workplace_type: "str",
      location: "str", error_class: "str", first_seen_at: "date", notes: "str",
    };
    const STATUS_RANK = { new: 0, viewed: 1, applied: 2, error: 3 };
    let SORT = { key: "first_seen_at", dir: "desc" };
    let ACTIVE_TAB = "jobs";  // "jobs" (default) | "applied" | "errors" | "metrics"
    let GRAN = "week";        // metrics bucket size: "day" | "week" | "month"
    const numOr = (v) => { const n = parseFloat(v); return isNaN(n) ? -Infinity : n; };

    function sortVal(j) {
      const t = SORT_TYPES[SORT.key];
      if (t === "num") return numOr(j[SORT.key]);
      if (t === "status") return STATUS_RANK[j.status] ?? 99;
      return String(j[SORT.key] ?? "");
    }
    function cmp(a, b) {
      const x = sortVal(a), y = sortVal(b);
      const r = typeof x === "number" ? x - y : x.localeCompare(y, "pt-BR", { sensitivity: "base" });
      return SORT.dir === "asc" ? r : -r;
    }

    const el = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmtDateTime = (iso) => {
      const d = new Date(iso);
      return isNaN(d) ? iso : d.toLocaleString("pt-BR");
    };
    const fmtDate = (iso) => {
      if (!iso) return "—";
      const d = new Date(iso);
      return isNaN(d) ? iso : d.toLocaleDateString("pt-BR");
    };

    let toastTimer;
    function toast(msg, isErr) {
      const t = el("toast");
      t.textContent = msg;
      t.className = "toast show" + (isErr ? " err" : "");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => (t.className = "toast"), 1800);
    }

    async function load() {
      try {
        const r = await fetch("/api/jobs");
        const data = await r.json();
        JOBS = data.jobs || [];
        ERROR_CLASSES = data.error_classes || [];
        LAST_RUN = data.last_run || null;
        el("sub").textContent = LAST_RUN ? `· última execução do motor: ${fmtDateTime(LAST_RUN)}` : "";
        render();
      } catch (e) {
        toast("Falha ao carregar vagas", true);
      }
    }

    function filtered() {
      const q = el("q").value.trim().toLowerCase();
      const onlyRelevant = el("onlyRelevant").checked;
      const onlyNew = el("onlyNew").checked;
      const hideApplied = el("hideApplied").checked;
      const showIrrelevant = el("showIrrelevant").checked;
      const matchesQuery = (j) => {
        if (!q) return true;
        return (j.job_title + " " + j.company + " " + j.location).toLowerCase().includes(q);
      };
      return JOBS.filter((j) => {
        // Errors and applied jobs each live in their own tab.
        if (ACTIVE_TAB === "errors") {
          if (j.status !== "error") return false;
          if (onlyRelevant && !j.relevant) return false;
          return matchesQuery(j);
        }
        if (ACTIVE_TAB === "applied") {
          if (j.status !== "applied") return false;
          if (onlyRelevant && !j.relevant) return false;
          return matchesQuery(j);
        }
        if (j.status === "error") return false;
        // Sub-bar jobs and superseded reposts (pipeline-flagged) stay out of
        // the main list unless asked for.
        if ((j.status === "irrelevant" || j.status === "duplicado") && !showIrrelevant) return false;
        if (onlyRelevant && !j.relevant) return false;
        if (onlyNew && j.status !== "new") return false;
        if (hideApplied && j.status === "applied") return false;
        return matchesQuery(j);
      });
    }

    function updateHeaders() {
      el("tbl").querySelectorAll("th[data-sort]").forEach((th) => {
        const base = th.dataset.label || (th.dataset.label = th.textContent.trim());
        const active = SORT.key === th.dataset.sort;
        th.textContent = base + (active ? (SORT.dir === "asc" ? " ▲" : " ▼") : "");
        th.classList.toggle("sorted", active);
      });
    }

    function render() {
      const metrics = ACTIVE_TAB === "metrics";
      const report = ACTIVE_TAB === "report";
      el("tableWrap").hidden = metrics || report;
      el("metricsWrap").hidden = !metrics;
      el("reportWrap").hidden = !report;
      document.querySelector(".controls").hidden = metrics;      // job filters (kept for report: search + só relevantes)
      el("metricsCtl").hidden = !metrics;                        // granularity picker
      if (metrics) { renderMetrics(); return; }
      if (report) { renderReport(); return; }

      const list = filtered().sort(cmp);
      el("tbl").className = "tab-" + ACTIVE_TAB;
      updateHeaders();
      const rows = el("rows");
      rows.innerHTML = "";
      el("empty").hidden = list.length > 0;

      for (const j of list) {
        const tr = document.createElement("tr");
        if (j.status === "applied") tr.className = "applied";

        const btns = STATUSES.map(([s, lbl]) =>
          `<button data-s="${s}" class="${j.status === s ? "on" : ""}">${lbl}</button>`
        ).concat(ERROR_CLASSES.map((c) =>
          `<button data-s="error" data-ec="${esc(c)}" title="Erro: ${esc(c)}" class="${j.status === "error" && j.error_class === c ? "on" : ""}">${esc(ERROR_CLASS_SHORT[c] || c)}</button>`
        )).join("");
        const clt = (j.score_clt === null || j.score_clt === undefined) ? "—" : j.score_clt;

        tr.innerHTML = `
          <td><span class="status-btns" data-link="${esc(j.link)}">${btns}</span></td>
          <td class="score">${esc(j.match_score)}</td>
          <td class="num">${esc(clt)}</td>
          <td>
            <a href="${esc(j.link)}" target="_blank" rel="noopener">${esc(j.job_title)}</a>
            <div class="company">${esc(j.company)}</div>
          </td>
          <td><span class="badge">${esc(j.inferred_contract_type)}</span></td>
          <td class="num">${esc(j.workplace_type)}</td>
          <td class="num">${esc(j.location)}</td>
          <td class="num col-class">${esc(j.error_class || "—")}</td>
          <td class="num">${esc(fmtDate(j.first_seen_at))}</td>
          <td><textarea class="notes" data-link="${esc(j.link)}" rows="1" placeholder="anotações…">${esc(j.notes)}</textarea></td>
        `;
        rows.appendChild(tr);
      }
      updateStats();
    }

    function updateStats() {
      const total = JOBS.length;
      const errors = JOBS.filter((j) => j.status === "error").length;
      const applied = JOBS.filter((j) => j.status === "applied").length;
      const viewed = JOBS.filter((j) => j.status === "viewed").length;
      const irrelevant = JOBS.filter((j) => j.status === "irrelevant").length;
      const shown = filtered().length;
      el("cErrors").textContent = errors;
      el("cApplied").textContent = applied;
      el("cJobs").textContent = total - errors - irrelevant;
      el("stats").innerHTML =
        `Exibindo <b>${shown}</b> · total <b>${total - errors - irrelevant}</b> · vistas <b>${viewed}</b> · inscritas <b>${applied}</b> · erros <b>${errors}</b> · irrelevantes <b>${irrelevant}</b>`;
    }

    // ---- Métricas (agregação client-side sobre os jobs já carregados) ----
    // Relevância é datada por quando a vaga entrou no banco (first_seen_at);
    // inscrições e erros por quando você as marcou (status_updated_at).
    const METRICS = [
      { key: "relevance", label: "Relevância", color: "#4f9cf9" },
      { key: "applied",   label: "Inscrições", color: "#3fb950" },
      { key: "error",     label: "Erros",      color: "#f85149" },
    ];
    const pad2 = (n) => String(n).padStart(2, "0");

    function periodKey(iso, gran) {
      if (!iso) return null;
      const d = new Date(iso);
      if (isNaN(d)) return null;
      const y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
      if (gran === "month") return `${y}-${pad2(m + 1)}`;
      if (gran === "day") return `${y}-${pad2(m + 1)}-${pad2(day)}`;
      const t = new Date(y, m, day);                 // week: segunda-feira local
      t.setDate(t.getDate() - ((t.getDay() + 6) % 7));
      return `${t.getFullYear()}-${pad2(t.getMonth() + 1)}-${pad2(t.getDate())}`;
    }

    function windowKeys(gran) {                       // últimos N períodos até hoje
      const n = gran === "day" ? 30 : 12;
      const now = new Date(), keys = [];
      for (let i = n - 1; i >= 0; i--) {
        const d = new Date(now);
        if (gran === "day") d.setDate(d.getDate() - i);
        else if (gran === "week") d.setDate(d.getDate() - i * 7);
        else d.setMonth(d.getMonth() - i);
        keys.push(periodKey(d.toISOString(), gran));
      }
      return [...new Set(keys)];
    }

    function keyLabel(key, gran) {                     // rótulo curto do eixo X
      const [y, m, d] = key.split("-");
      if (gran === "month") return `${m}/${y.slice(2)}`;
      return `${d}/${m}`;
    }

    function aggregate(gran) {
      const b = {};
      const bump = (k, metric) => { if (k) (b[k] || (b[k] = { relevance: 0, applied: 0, error: 0 }))[metric]++; };
      for (const j of JOBS) {
        if (j.relevant) bump(periodKey(j.first_seen_at, gran), "relevance");
        const when = j.status_updated_at || j.first_seen_at;
        if (j.status === "applied") bump(periodKey(when, gran), "applied");
        if (j.status === "error") bump(periodKey(when, gran), "error");
      }
      return b;
    }

    function renderMetrics() {
      el("legend").innerHTML = METRICS.map((m) =>
        `<span><i style="background:${m.color}"></i>${m.label}</span>`).join("");

      const buckets = aggregate(GRAN);
      const keys = windowKeys(GRAN);
      const data = keys.map((k) => ({ k, ...(buckets[k] || { relevance: 0, applied: 0, error: 0 }) }));
      const totals = METRICS.reduce((a, m) => (a[m.key] = data.reduce((s, d) => s + d[m.key], 0), a), {});
      el("metricsStats").innerHTML = METRICS.map((m) =>
        `${m.label} <b>${totals[m.key]}</b>`).join(" · ");

      const hasData = METRICS.some((m) => totals[m.key] > 0);
      el("metricsEmpty").hidden = hasData;
      const svg = el("chart");
      if (!hasData) { svg.innerHTML = ""; return; }

      const maxVal = Math.max(1, ...data.flatMap((d) => METRICS.map((m) => d[m.key])));
      const groupW = 60, barW = 15, top = 12, plotH = 250, base = top + plotH, W = keys.length * groupW + 30;
      svg.setAttribute("viewBox", `0 0 ${W} ${base + 50}`);

      let out = `<line x1="24" y1="${base}" x2="${W}" y2="${base}" stroke="#2c3743"/>`;
      out += `<text x="20" y="${top + 4}" text-anchor="end">${maxVal}</text>`;
      data.forEach((d, i) => {
        const gx = 30 + i * groupW;
        METRICS.forEach((m, mi) => {
          const v = d[m.key];
          const h = (v / maxVal) * plotH;
          const x = gx + mi * (barW + 1);
          const y = base - h;
          out += `<rect class="bar" x="${x}" y="${y}" width="${barW}" height="${h}" fill="${m.color}"><title>${m.label}: ${v}</title></rect>`;
          if (v > 0) out += `<text class="val" x="${x + barW / 2}" y="${y - 3}" text-anchor="middle">${v}</text>`;
        });
        out += `<text x="${gx + (barW * 3) / 2}" y="${base + 18}" text-anchor="middle">${keyLabel(d.k, GRAN)}</text>`;
      });
      svg.innerHTML = out;
    }

    el("granBtns").addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-g]");
      if (!btn) return;
      GRAN = btn.dataset.g;
      el("granBtns").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === btn));
      renderMetrics();
    });

    async function postStatus(link, body) {
      const r = await fetch("/api/status", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ link, ...body }),
      });
      if (!r.ok) throw new Error("save failed");
      return r.json();
    }

    // Status buttons (event delegation).
    el("rows").addEventListener("click", async (ev) => {
      const btn = ev.target.closest(".status-btns button");
      if (!btn) return;
      const link = btn.parentElement.dataset.link;
      const status = btn.dataset.s;
      const errorClass = btn.dataset.ec || "";
      const job = JOBS.find((j) => j.link === link);
      const prev = job.status;
      const prevClass = job.error_class;
      job.status = status;
      // Leaving "error" drops any stale classification (matches the backend).
      job.error_class = errorClass;
      render();
      try {
        await postStatus(link, errorClass ? { status, error_class: errorClass } : { status });
        toast("Salvo: " + (errorClass ? `Erro (${errorClass})` : STATUSES.find((s) => s[0] === status)[1]));
      } catch (e) {
        job.status = prev;
        job.error_class = prevClass;
        render();
        toast("Erro ao salvar", true);
      }
    });

    // Notes: save on blur if changed.
    el("rows").addEventListener("blur", async (ev) => {
      const ta = ev.target.closest("textarea.notes");
      if (!ta) return;
      const link = ta.dataset.link;
      const job = JOBS.find((j) => j.link === link);
      const val = ta.value;
      if (job.notes === val) return;
      try {
        await postStatus(link, { notes: val });
        job.notes = val;
        ta.classList.add("saved");
        setTimeout(() => ta.classList.remove("saved"), 1200);
        toast("Nota salva");
      } catch (e) {
        toast("Erro ao salvar nota", true);
      }
    }, true);

    // Column sorting: click a header to sort; click again to flip direction.
    el("tbl").querySelector("thead").addEventListener("click", (ev) => {
      const th = ev.target.closest("th[data-sort]");
      if (!th) return;
      const key = th.dataset.sort;
      if (SORT.key === key) {
        SORT.dir = SORT.dir === "asc" ? "desc" : "asc";
      } else {
        SORT.key = key;
        SORT.dir = SORT_TYPES[key] === "str" ? "asc" : "desc";
      }
      render();
    });

    // ---- Relatório: comparar os 3 scorers + expandir análise (Gemini) por vaga ----
    let REP_SORT = { key: "score_vetor_desc", dir: "desc" };
    let REP_OPEN = new Set();  // links com detalhe aberto

    function reportList() {
      const q = el("q").value.trim().toLowerCase();
      const onlyRelevant = el("onlyRelevant").checked;
      return JOBS.filter((j) => {
        if (j.status === "error") return false;
        if (onlyRelevant && !j.relevant) return false;
        if (q && !(j.job_title + " " + j.company + " " + j.location).toLowerCase().includes(q)) return false;
        return true;
      });
    }
    const repVal = (j) => {
      if (REP_SORT.key === "job_title") return String(j.job_title ?? "");
      const n = parseFloat(j[REP_SORT.key]); return isNaN(n) ? -Infinity : n;
    };
    function repCmp(a, b) {
      const x = repVal(a), y = repVal(b);
      const r = typeof x === "number" ? x - y : x.localeCompare(y, "pt-BR", { sensitivity: "base" });
      return REP_SORT.dir === "asc" ? r : -r;
    }
    // Gemini is 0–100; the vector scores are raw cosines 0–1 (2 decimals).
    const fmtScore = (v, cosine) =>
      (v === null || v === undefined || v === "") ? '<span class="score-na">—</span>'
        : (cosine ? Number(v).toFixed(2) : esc(v));

    function renderReport() {
      const list = reportList().sort(repCmp);
      el("reportEmpty").hidden = list.length > 0;
      el("repTbl").querySelectorAll("th[data-rsort]").forEach((th) => {
        const base = th.dataset.label || (th.dataset.label = th.textContent.trim());
        const active = REP_SORT.key === th.dataset.rsort;
        th.textContent = base + (active ? (REP_SORT.dir === "asc" ? " ▲" : " ▼") : "");
        th.classList.toggle("sorted", active);
      });
      const rows = el("repRows");
      rows.innerHTML = "";
      for (const j of list) {
        const open = REP_OPEN.has(j.link);
        const tr = document.createElement("tr");
        tr.className = "rep-row";
        tr.dataset.link = j.link;
        tr.innerHTML = `
          <td>${open ? "▾ " : "▸ "}<a href="${esc(j.link)}" target="_blank" rel="noopener">${esc(j.job_title)}</a>
            <div class="company">${esc(j.company)}</div></td>
          <td class="score-cell">${fmtScore(j.score_gemini, false)}</td>
          <td class="score-cell">${fmtScore(j.score_vetor_desc, true)}</td>
          <td class="score-cell">${fmtScore(j.score_title, true)}</td>`;
        rows.appendChild(tr);
        if (open) {
          const det = document.createElement("tr");
          det.className = "rep-detail";
          const li = (xs) => (xs && xs.length ? xs.map((s) => `<li>${esc(s)}</li>`).join("") : "<li>—</li>");
          det.innerHTML = `<td colspan="4" class="rep-detail">
            <h4>Pontos fortes</h4><ul>${li(j.strengths)}</ul>
            <h4>Gaps</h4><ul>${li(j.gaps)}</ul>
            <h4>Veredito</h4><div class="rep-verdict">${esc(j.verdict || "—")}</div></td>`;
          rows.appendChild(det);
        }
      }
      el("stats").innerHTML = `Relatório · <b>${list.length}</b> vaga(s) · Gemini 0–100, Vetor/Título cosseno 0–1`;
    }

    el("repTbl").querySelector("thead").addEventListener("click", (ev) => {
      const th = ev.target.closest("th[data-rsort]");
      if (!th) return;
      const key = th.dataset.rsort;
      if (REP_SORT.key === key) REP_SORT.dir = REP_SORT.dir === "asc" ? "desc" : "asc";
      else { REP_SORT.key = key; REP_SORT.dir = key === "job_title" ? "asc" : "desc"; }
      renderReport();
    });
    el("repRows").addEventListener("click", (ev) => {
      if (ev.target.closest("a")) return;  // deixa o link abrir
      const tr = ev.target.closest("tr.rep-row");
      if (!tr) return;
      const link = tr.dataset.link;
      if (REP_OPEN.has(link)) REP_OPEN.delete(link); else REP_OPEN.add(link);
      renderReport();
    });

    // Tabs: "Vagas" (default), "Inscritas", "Erros", "Relatório", "Métricas".
    const TABS = [["jobs", "tabJobs"], ["applied", "tabApplied"], ["errors", "tabErrors"], ["report", "tabReport"], ["metrics", "tabMetrics"]];
    function setTab(tab) {
      if (tab === ACTIVE_TAB) return;
      ACTIVE_TAB = tab;
      TABS.forEach(([t, id]) => el(id).classList.toggle("on", t === tab));
      render();
    }
    TABS.forEach(([t, id]) => el(id).addEventListener("click", () => setTab(t)));

    ["q", "onlyRelevant", "onlyNew", "hideApplied", "showIrrelevant"].forEach((id) =>
      el(id).addEventListener("input", render));

    // ---- Pipeline run control (trigger + concurrency guard + progress + schedule) ----
    const OUTCOME_LABELS = { success: "✓ concluída", failed: "✕ falhou", interrupted: "⚠ interrompida" };
    let RUN = { running: false, next_at: null, sched: false, last_outcome: null, offset: 0 };
    let RUN_WAS_RUNNING = false;
    let runPollTimer;

    function fmtCountdown(sec) {
      if (sec < 0) sec = 0;
      const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
      const pad = (n) => String(n).padStart(2, "0");
      return h > 0 ? `${h}h${pad(m)}m` : `${pad(m)}:${pad(s)}`;
    }

    function applyRunState(s) {
      const running = s.status === "running";
      RUN.running = running;
      RUN.sched = !!s.scheduler_enabled;
      RUN.next_at = s.next_run_at ? Date.parse(s.next_run_at) : null;
      RUN.last_outcome = s.last_outcome || null;
      // Offset the server clock so the countdown ignores client-clock skew.
      if (s.server_time) RUN.offset = Date.now() - Date.parse(s.server_time);

      el("runBtn").disabled = running;
      el("runProgress").hidden = !running;
      if (running) {
        const p = s.progress || {};
        el("runBarFill").style.width = (p.percent || 0) + "%";
        el("runPct").textContent = `${p.stage || ""} ${p.percent || 0}%`;
        el("runStatus").textContent = p.detail || "em execução…";
      } else if (s.last_outcome) {
        el("runStatus").textContent = "última: " + (OUTCOME_LABELS[s.last_outcome] || s.last_outcome);
      } else {
        el("runStatus").textContent = "";
      }
      renderRunButton();

      // A run just finished → refresh the job list to show new results.
      if (RUN_WAS_RUNNING && !running) {
        toast("Execução concluída");
        load();
      }
      RUN_WAS_RUNNING = running;
      return running;
    }

    // Local 1s tick so the countdown on the button moves between polls.
    function renderRunButton() {
      if (RUN.running) { el("runBtn").textContent = "⏳ Rodando…"; return; }
      if (RUN.sched && RUN.next_at) {
        const remaining = Math.round((RUN.next_at - (Date.now() - RUN.offset)) / 1000);
        el("runBtn").textContent = `▶ Rodar agora · auto em ${fmtCountdown(remaining)}`;
      } else {
        el("runBtn").textContent = "▶ Rodar agora";
      }
    }
    setInterval(renderRunButton, 1000);

    async function pollRun() {
      let running = false;
      try {
        const r = await fetch("/api/run/status");
        running = applyRunState(await r.json());
      } catch (e) { /* keep last state; retry on next tick */ }
      clearTimeout(runPollTimer);
      runPollTimer = setTimeout(pollRun, running ? 2000 : 15000);
    }

    el("runBtn").addEventListener("click", async () => {
      el("runBtn").disabled = true;
      try {
        const r = await fetch("/api/run", { method: "POST" });
        if (r.status === 202) toast("Execução iniciada");
        else if (r.status === 409) toast("Já em execução", true);
        else toast("Falha ao iniciar", true);
      } catch (e) {
        toast("Falha ao iniciar", true);
      }
      pollRun();  // refresh immediately and resume fast polling
    });

    load();
    pollRun();
  </script>
</body>
</html>
