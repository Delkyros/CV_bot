# ---------------------------------------------------------------------------
# Example configuration. Copy this file to "config/keywords.yaml" and adjust
# the search terms, filters and your own professional profile.
#
# NOTE: the keys below are kept in Portuguese on purpose — they are read as-is
# by the pipeline (main.py / scraper.py). Only the values are meant to be edited.
# ---------------------------------------------------------------------------

# Job titles to search for. Do NOT append "CLT" here — the contract type is
# inferred from each job description by the LLM classifier.
termos_busca:
  - "AI Engineer"
  - "Machine Learning Engineer"
  - "Data Scientist"
  - "Engenheiro de Machine Learning"
  - "Cientista de Dados"

# Desired contract type. "CLT" enables the LLM-based contract filter.
tipo_contratacao: "CLT"

# Max jobs collected per (search term x filter) combination.
max_vagas_por_termo: 100

# Job posting time filter (LinkedIn f_TPR parameter).
# Accepted values: "24h", "semana", "mes". Leave empty to disable.
tempo_publicacao: "24h"

# geo_id is LinkedIn's location identifier (geoId). It is what reliably
# restricts the region on the Guest API; the `localizacao` text alone returns
# US jobs. 106057199 = Brazil. For hybrid/on-site filters, use the geoId of the
# TARGET CITY so LinkedIn pre-restricts the region (otherwise Brazil-wide jobs
# bury the few local ones). Look a geoId up with:
#   https://www.linkedin.com/jobs-guest/api/typeaheadHits?typeaheadType=GEO&query=<city>
#
# `distancia` is LinkedIn's search radius in MILES around geo_id (its `distance`
# parameter). Verified against the Guest API on a Florianópolis geoId: 0 returns
# nothing, 25 and 50 keep the city plus its immediate neighbours, 100 reaches the
# next cities over (which the hub gate then rejects — wasted cards). The implicit
# default when the key is omitted was not stable across probes, so set it
# explicitly when the radius matters.
#
# It only bites when geo_id is a CITY — on a country-level geoId (the remote
# filter) it is a no-op, so it is left off there. Widening it raises recall; the
# hub-city gate (SCRAPER_HYBRID_HUB_CITIES) still has the final say on the job's
# location.
filtros_busca:
  - modelo_trabalho: "remoto"
    localizacao: "Brasil"
    geo_id: "106057199"
  - modelo_trabalho: "hibrido"
    localizacao: "São Paulo, São Paulo, Brasil"
    geo_id: "104746682"   # São Paulo city geoId (example)
    distancia: 25
#
# For HYBRID jobs, the geo_id above only biases LinkedIn's results — the actual
# location gate is the env var SCRAPER_HYBRID_HUB_CITIES (see the README Tunables
# table). Its default is the Grande Florianópolis hubs; for another region put
# YOUR hub cities in .env, e.g.:
#   SCRAPER_HYBRID_HUB_CITIES=são paulo,guarulhos,osasco
# Remote jobs are kept unless the location names a rejected country
# (SCRAPER_REMOTE_REJECTED_COUNTRIES). Output language: LLM_OUTPUT_LANGUAGE=English.

# Your professional profile. Used by the LLM to score the match against each job.
perfil_candidato:
  nivel_experiencia: "Pleno"

  resumo_profissional: |
    Data Scientist / Machine Learning Engineer with hands-on experience building
    end-to-end AI solutions: LLM-based agents, RAG pipelines, vector search and
    REST APIs deployed to the cloud, or On-Premisses. Strong software-engineering
    practices applied to data products.

  competencias_tecnicas:
    ia_e_llms:
      - "AI Agents"
      - "RAG Pipelines"
      - "LangChain"
      - "Vector Databases"
    linguagens_e_backend:
      - "Python"
      - "SQL (PostgreSQL)"
      - "RESTful APIs"
      - "Pandas, Scikit-learn, PyTorch, Langraph, LangSmith, Flask, beautifulsoup, Plotly, opcua, asyncua, Fastapi, chonkie, qdrant, marker"
    engenharia_de_dados_e_cloud:
      - "ETL/ELT Pipelines"
      - "Docker"
      - "Kubernetes"
      - "Kafka"
      - "Synapse"
      - "Databriks"
      - "Azure Open AI"
      - "Azure"
      - "CI/CD (GitHub Actions)"

  soft_skills:
    - "Clear communication and cross-functional collaboration."
    - "Turning complex business requirements into reliable software."
    - "Fast problem understanding."

# Deterministic title scope blocklist (SEED). Each entry has a human-readable
# `motivo` (shown in logs / the web UI) and a `padrao` (regex matched against the
# accent-stripped, lowercased job TITLE). A title matching any padrao is dropped
# BEFORE any LLM call. At runtime this seed is unioned with the titles you flag
# "Escopo incorreto" in the web app (the learn-from-marks blocklist).
#
# This default set is tuned for a senior Data Scientist / ML-AI Engineer. It is a
# REPLACEABLE DEFAULT: for another profession, edit these entries so they drop the
# tracks that are off-target for YOU (and never your target roles). Empty list =
# no seed drops (the app then relies on the learned blocklist + embedding gate + LLM).
#
# Example for a DIFFERENT profession (e.g. a Backend Developer, who would instead
# want to drop data-science / analyst / non-technical titles):
#   escopo_fora_de_alvo:
#     - motivo: 'ciência de dados / ML (não é backend)'
#       padrao: '\bcientista de dados\b|\bdata scientist\b|machine learning'
#     - motivo: 'função não-técnica'
#       padrao: '\bvendedor(?:a)?\b|\bmotorist[ao]\b|\benfermeir[oa]\b'
escopo_fora_de_alvo:
  - motivo: 'desenvolvedor de BI/Qlik/Power BI'
    padrao: '\bqlik\b|power\s*bi|\bbi\b[^.,|]*\b(developer|desenvolvedor)\b|\b(developer|desenvolvedor)\b[^.,|]*\bbi\b'
  - motivo: 'inteligencia de mercado/pesquisa'
    padrao: 'intelig\w* de mercado|market intelligence|pesquisa de mercado|market research'
  - motivo: 'analista de sistemas'
    padrao: '\banalista de sistemas?\b'
  - motivo: 'dev generico Jr/Node/Graduate'
    padrao: '\bnode\.?js\b|\bnodejs\b|\bgraduate\b|\btrainees?\b'
  - motivo: 'função não-técnica (alimentação/atendimento)'
    padrao: '\bcozinheir[oa]\b|\bchef\b|auxiliar de cozinha|\bgarcom\b|\bgarconete\b|\bbarista\b|\bbartender\b|\batendente\b|recepcionist[ao]|\bcamareir[oa]\b|\bcopeir[oa]\b'
  - motivo: 'função não-técnica (vendas/varejo)'
    padrao: '\bvendedor(?:a)?\b|representante comercial|consultor(?:a)? de vendas|consultor(?:a)? comercial|promotor(?:a)? de vendas|executiv[oa] de vendas|operador(?:a)? de caixa|\bbalconist[ao]\b|\bestoquist[ao]\b|\brepositor(?:a)?\b'
  - motivo: 'função não-técnica (logística/operação/ofícios)'
    padrao: '\bmotorist[ao]\b|\bentregador(?:a)?\b|\bmotoboy\b|\beletricist[ao]\b|\bmecanic[oa]\b|\bsoldador\b|\bpedreir[oa]\b|\bpintor\b|\bencanador\b|auxiliar de producao|operador(?:a)? de empilhadeira|\bvigilante\b|\bporteir[oa]\b|\bzelador\b'
  - motivo: 'função não-técnica (saúde/administrativo)'
    padrao: '\benfermeir[oa]\b|tecnico de enfermagem|\bmedic[oa]\b|\bdentista\b|\bfisioterapeuta\b|\bnutricionista\b|\bfarmaceutic[oa]\b|auxiliar administrativ[oa]|assistente administrativ[oa]|\btelemarketing\b|\bsecretari[ao]\b|\bcostureir[oa]\b'
  - motivo: 'desenvolvedor de software/backend/mobile'
    padrao: '\bback[\s-]?end\b|\bfront[\s-]?end\b|\bfull[\s-]?stack\b|\bmobile\b|\bandroid\b|\bios\b|\bflutter\b|react native|\bdelphi\b|\bcamunda\b|\bdynamics\b|\blaravel\b|\bvue\.?js\b|\bphp\b|\bjava\b|\brpa\b|\bprogramador\b|desenvolvedor de software|software developer|desenvolvedor de sistemas|desenvolvimento de sistemas|analista de desenvolvimento'
  - motivo: 'data analyst/analytics (não é ciência de dados)'
    padrao: 'analista de dados\b|\bdata analyst\b|web analytics'
  - motivo: 'RH/recrutamento'
    padrao: 'business partner|\bhr\b|recursos humanos|atracao e selecao|recrutamento|people analytics'
  - motivo: 'vendas/comercial/marketing'
    padrao: '\bcomercial\b|de vendas\b|vendas externas|pre[\s-]?vendas|customer success|grandes contas|executiv[oa] de|gerente de vendas|supervisor de vendas|\bmarketing\b|merchandising|\bbanker\b|incorporacao imobiliaria|imobiliari'
  - motivo: 'QA/testes'
    padrao: '\bqa\b|quality assurance|analista de teste'
  - motivo: 'finanças/controladoria/fraude'
    padrao: 'controladoria|prevencao a fraude|\bauditoria\b|financeir[ao] de ti'
  - motivo: 'logística/operações'
    padrao: '\bwms\b|transportes|logistica|gestao de estoque'
  - motivo: 'suporte/CRM/franquias'
    padrao: 'suporte a franquias|\bfranquias\b|salesforce|\bcrm\b'
  - motivo: 'TI/pesquisa/planejamento genérico'
    padrao: 'analista de ti\b|\bpesquisador\b|analista de planejamento\b'
  - motivo: 'segurança da informação'
    padrao: 'seguranca da informacao|information security'
